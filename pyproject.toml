[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helsinki-earnings-notifier"
version = "0.1.0"
description = "Free, local ELT pipeline for Nasdaq Helsinki financial-report reminders"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "dateparser>=1.2,<2",
  "dbt-core>=1.8,<2",
  "dbt-duckdb>=1.8,<2",
  "duckdb>=1.1,<2",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "tenacity>=9,<10",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
earnings-notifier = "earnings_notifier.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/earnings_notifier"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
